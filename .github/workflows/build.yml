name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - run: unzip -o LumenVisuals-1.21.4-project.zip
      - run: cd LumenVisuals && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-visuals
          path: LumenVisuals/build/libs/lumen-visuals-1.0.0.jar