name: Build Lumen Visuals

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Find Gradle project directory
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts in the repository." >&2
            echo "Upload the contents of the LumenVisuals project, or keep the project folder in the repository." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Gradle project directory: $PROJECT_DIR"

      - name: Build Fabric mod
        run: gradle --no-daemon clean build
        working-directory: ${{ steps.project.outputs.project_dir }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-visuals-fabric-1.21.4
          path: ${{ steps.project.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
